rue}, {"id": "ap-79242", "title": "Scalable honeycomb top contact to increase the light absorption and reduce the series resistance of thin film solar cells", "title_es": "Scalable honeycomb top contact to increase the light absorption and reduce the series resistance of thin film solar cells", "title_id": "Scalable honeycomb top contact to increase the light absorption and reduce the series resistance of thin film solar cells", "source": "Appropedia", "url": "https://www.appropedia.org/Scalable_honeycomb_top_contact_to_increase_the_light_absorption_and_reduce_the_series_resistance_of_thin_film_solar_cells", "oh": true}, {"id": "wec-the-last-whole-earth-catalog", "title": "The Last Whole Earth Catalog", "title_es": "The Last Whole Earth Catalog", "title_id": "The Last Whole Earth Catalog", "source": "The Last Whole Earth Catalog (January 1971)", "url": "https://wholeearth.info/p/the-last-whole-earth-catalog-january-1971", "oh": false}, {"id": "wec-access-to-tools", "title": "The Whole Earth Catalog — \"access to tools\"", "title_es": "El Whole Earth Catalog: \"access to tools\" (acceso a herramientas)", "title_id": "Whole Earth Catalog -- \"akses ke perkakas\"", "source": "Whole Earth Catalog (Fall 1968)", "url": "https://wholeearth.info/p/whole-earth-catalog-fall-1968", "oh": false}]}]}}, "crisis": [{"id": "crisis-boil-water", "title": "Boil water to make it safe", "summary": "Boiling is the most reliable way to kill disease germs in water when the supply is unsafe.", "how_it_works": "Filter cloudy water through a clean cloth first. Bring clear water to a rolling boil for 1 minute (3 minutes at altitudes above ~2,000 m / 6,500 ft), then let it cool and store covered.", "need": "Water", "phase": ["acute-72h", "days-after"], "source": "CDC", "source_url": "https://www.cdc.gov/water-emergency/about/index.html", "caveat": "Kills germs but does NOT remove chemical contamination, fuel or heavy metals.", "tags": ["water", "disinfection", "boiling"], "i18n": {"es": {"title": "Hervir el agua para hacerla segura", "summary": "Hervir es la forma más confiable de matar los gérmenes que causan enfermedades en el agua cuando el suministro no es seguro.", "how_it_works": "Primero filtra el agua turbia a través de un paño limpio. Lleva el agua clara a un hervor fuerte durante 1 minute (3 minutes en altitudes superiores a ~2,000 m / 6,500 ft), luego déjala enfriar y guárdala tapada.", "caveat": "Mata los gérmenes, pero NO elimina la contaminación química, el combustible ni los metales pesados."}, "id": {"title": "Rebus air agar aman", "summary": "Merebus adalah cara paling andal untuk membunuh kuman penyebab penyakit dalam air ketika pasokan tidak aman.", "how_it_works": "Saring dulu air keruh melalui kain bersih. Didihkan air jernih hingga mendidih bergolak selama 1 minute (3 minutes pada ketinggian di atas ~2,000 m / 6,500 ft), lalu biarkan dingin dan simpan dalam wadah tertutup.", "caveat": "Membunuh kuman tetapi TIDAK menghilangkan kontaminasi kimia, bahan bakar, atau logam berat."}}}, {"id": "crisis-bleach-chlorination-cdc", "title": "Disinfect water with household bleach (CDC)", "summary": "Plain unscented household bleach makes water safe to drink when you can't boil.", "how_it_works": "Use unscented household bleach (5–9% sodium hypochlorite). Add 2 drops per litre/quart, 8 drops per gallon (a bit less than 1/8 teaspoon), or 40 drops (1/2 teaspoon) per 5 gallons. Stir and let stand at least 30 minutes — the water should have a slight chlorine smell. Double the dose if the water is cloudy, coloured or very cold.", "need": "Water", "phase": ["days-after", "prolonged"], "source": "CDC", "source_url": "https://www.cdc.gov/water-emergency/about/index.html", "caveat": "Measure exactly; bleach must be unscented and fresh. Over-chlorination is unsafe. Not a substitute for a safe utility supply.", "tags": ["water", "chlorination", "bleach"], "i18n": {"es": {"title": "Desinfectar el agua con cloro doméstico (CDC)", "summary": "El cloro doméstico común, sin perfume, hace que el agua sea segura para beber cuando no puedes hervirla.", "how_it_works": "Usa cloro doméstico sin perfume (5–9% de hipoclorito de sodio). Agrega 2 drops por litro/cuarto de galón, 8 drops por galón (un poco menos de 1/8 teaspoon), o 40 drops (1/2 teaspoon) por cada 5 galones. Revuelve y deja reposar al menos 30 minutes: el agua debe tener un ligero olor a cloro. Duplica la dosis si el agua está turbia, con color o muy fría.", "caveat": "Mide con exactitud; el cloro debe ser sin perfume y fresco. El exceso de cloro es peligroso. No sustituye un suministro seguro de la red pública."}, "id": {"title": "Desinfeksi air dengan pemutih rumah tangga (CDC)", "summary": "Pemutih rumah tangga biasa tanpa pewangi membuat air aman untuk diminum ketika Anda tidak bisa merebusnya.", "how_it_works": "Gunakan pemutih rumah tangga tanpa pewangi (5–9% natrium hipoklorit). Tambahkan 2 drops per liter/quart, 8 drops per galon (sedikit kurang dari 1/8 sendok teh), atau 40 drops (1/2 sendok teh) per 5 galon. Aduk dan diamkan setidaknya 30 minutes — air seharusnya berbau klorin samar. Gandakan dosisnya jika air keruh, berwarna, atau sangat dingin.", "caveat": "Takar secara tepat; pemutih harus tanpa pewangi dan masih segar. Klorinasi berlebihan tidak aman. Bukan pengganti pasokan air bersih dari penyedia layanan resmi."}}}, {"id": "crisis-bleach-chlorination-epa", "title": "Bleach dosing by concentration (EPA)", "summary": "If your bleach states its strength, dose by concentration for accuracy.", "how_it_works": "Per 1 gallon of water: 8 drops of 6% bleach, OR 6 drops of 8.25% bleach. Stir and let stand 30 minutes; if there is no slight chlorine odour, repeat the dose and wait another 15 minutes. Double the dose for cloudy or cold water.", "need": "Water", "phase": ["days-after"], "source": "US EPA", "source_url": "https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water", "caveat": "EPA figures assume 6% / 8.25% US bleach. If your bottle differs, use the CDC 5–9% method instead.", "tags": ["water", "chlorination", "bleach"], "i18n": {"es": {"title": "Dosificación de cloro según la concentración (EPA)", "summary": "Si tu cloro indica su concentración, dosifícalo según la concentración para mayor exactitud.", "how_it_works": "Por cada 1 galón de agua: 8 drops de cloro al 6%, O 6 drops de cloro al 8.25%. Revuelve y deja reposar 30 minutes; si no hay un ligero olor a cloro, repite la dosis y espera otros 15 minutes. Duplica la dosis si el agua está turbia o fría.", "caveat": "Las cifras de la EPA suponen cloro estadounidense al 6% / 8.25%. Si tu botella es distinta, usa en su lugar el método del CDC de 5–9%."}, "id": {"title": "Pemberian dosis pemutih berdasarkan konsentrasi (EPA)", "summary": "Jika pemutih Anda mencantumkan kekuatannya, beri dosis berdasarkan konsentrasi agar akurat.", "how_it_works": "Per 1 galon air: 8 drops pemutih 6%, ATAU 6 drops pemutih 8.25%. Aduk dan diamkan 30 minutes; jika tidak ada bau klorin samar, ulangi dosisnya dan tunggu 15 minutes lagi. Gandakan dosis untuk air keruh atau dingin.", "caveat": "Angka EPA mengasumsikan pemutih AS 6% / 8.25%. Jika botol Anda berbeda, gunakan metode CDC 5–9% sebagai gantinya."}}}, {"id": "crisis-sodis-solar", "title": "SODIS — disinfect water with sunlight", "summary": "Clear water in a plastic bottle left in strong sun becomes safe to drink — no fuel, no chemicals.", "how_it_works": "Fill clear, colourless PET plastic bottles of 1–2 litres (water no deeper than ~10 cm) with low-turbidity, clear water. Lay them on their side in direct sun for at least 6 hours under bright to partly cloudy sky; if it is fully overcast, leave them out across 2 consecutive days.", "need": "Water", "phase": ["prolonged"], "source": "EAWAG / Sandec (SODIS)", "source_url": "https://www.eawag.ch/en/department/sandec/projects/swp/solar-water-disinfection-sodis/", "caveat": "Only works on clear water — pre-filter turbid water. Does not remove chemical contamination.", "tags": ["water", "solar", "disinfection", "off-grid"], "i18n": {"es": {"title": "SODIS — desinfectar el agua con la luz del sol", "summary": "El agua clara en una botella plástica, dejada bajo un sol fuerte, se vuelve segura para beber: sin combustible, sin químicos.", "how_it_works": "Llena botellas plásticas PET transparentes e incoloras de 1–2 litros (con el agua a no más de ~10 cm de profundidad) con agua clara y de baja turbidez. Acuéstalas de lado bajo el sol directo durante al menos 6 hours con cielo brillante a parcialmente nublado; si está completamente nublado, déjalas afuera a lo largo de 2 days consecutivos.", "caveat": "Solo funciona con agua clara: prefiltra el agua turbia. No elimina la contaminación química."}, "id": {"title": "SODIS — desinfeksi air dengan sinar matahari", "summary": "Air jernih dalam botol plastik yang dibiarkan di bawah sinar matahari kuat menjadi aman untuk diminum — tanpa bahan bakar, tanpa bahan kimia.", "how_it_works": "Isi botol plastik PET yang jernih dan tidak berwarna berukuran 1–2 liter (kedalaman air tidak lebih dari ~10 cm) dengan air jernih berkekeruhan rendah. Baringkan botol pada sisinya di bawah sinar matahari langsung selama setidaknya 6 hours di bawah langit cerah hingga berawan sebagian; jika langit tertutup awan sepenuhnya, biarkan botol di luar selama 2 hari berturut-turut.", "caveat": "Hanya bekerja pada air jernih — saring dulu air yang keruh. Tidak menghilangkan kontaminasi kimia."}}}, {"id": "crisis-cloth-prefiltration", "title": "Pre-filter cloudy water before disinfecting", "summary": "Remove dirt and particles first so disinfection actually works.", "how_it_works": "Pour cloudy water through a clean cloth, paper towel or coffee filter to remove sediment before boiling, chlorinating or using SODIS. Ceramic/membrane filters need a pore size of about 1 micron or less to remove parasites and 0.3 micron for bacteria — and they still will not remove viruses, so follow filtration with chemical disinfection.", "need": "Water", "phase": ["days-after"], "source": "CDC", "source_url": "https://www.cdc.gov/water-emergency/about/index.html", "caveat": "Filtration alone is not enough for viruses — always disinfect after filtering.", "tags": ["water", "filtration"], "i18n": {"es": {"title": "Prefiltrar el agua turbia antes de desinfectarla", "summary": "Elimina primero la tierra y las partículas para que la desinfección realmente funcione.", "how_it_works": "Vierte el agua turbia a través de un paño limpio, una toalla de papel o un filtro de café para quitar el sedimento antes de hervirla, clorarla o usar SODIS. Los filtros de cerámica/membrana necesitan un tamaño de poro de aproximadamente 1 micrón o menos para eliminar parásitos y de 0.3 micrón para bacterias, y aun así no eliminan los virus, así que después de filtrar realiza una desinfección química.", "caveat": "Filtrar por sí solo no basta contra los virus: desinfecta siempre después de filtrar."}, "id": {"title": "Saring dulu air keruh sebelum desinfeksi", "summary": "Hilangkan kotoran dan partikel terlebih dahulu agar desinfeksi benar-benar bekerja.", "how_it_works": "Tuang air keruh melalui kain bersih, tisu dapur, atau filter kopi untuk menghilangkan sedimen sebelum merebus, mengklorinasi, atau menggunakan SODIS. Filter keramik/membran memerlukan ukuran pori sekitar 1 mikron atau kurang untuk menghilangkan parasit dan 0,3 mikron untuk bakteri — dan filter itu tetap tidak akan menghilangkan virus, jadi lanjutkan penyaringan dengan desinfeksi kimia.", "caveat": "Penyaringan saja tidak cukup untuk virus — selalu lakukan desinfeksi setelah menyaring."}}}, {"id": "crisis-calcium-hypochlorite-stock", "title": "Make a chlorine stock from pool granules (fallback)", "summary": "When no liquid bleach is left, calcium hypochlorite granules can be made into a disinfecting stock.", "how_it_works": "In a ventilated area, wearing eye protection, dissolve about 1 heaping teaspoon (~1/4 oz) of granular calcium hypochlorite (HTH) in 2 gallons of water to make a stock solution (~500 mg/L). Then disinfect drinking water by mixing 1 part of this stock into 100 parts water (about 1 pint of stock per 12.5 gallons).", "need": "Water", "phase": ["prolonged"], "source": "US EPA", "source_url": "https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water", "caveat": "HTH is a strong oxidant — handle and store strictly per label; not for inexperienced users; never mix with other chemicals.", "tags": ["water", "chlorination", "fallback"], "i18n": {"es": {"title": "Preparar una solución madre de cloro con granulado de piscina (alternativa)", "summary": "Cuando ya no queda cloro líquido, el granulado de hipoclorito de calcio puede convertirse en una solución madre desinfectante.", "how_it_works": "En un área ventilada, usando protección para los ojos, disuelve alrededor de 1 heaping teaspoon (~1/4 oz) de hipoclorito de calcio granulado (HTH) en 2 galones de agua para preparar una solución madre (~500 mg/L). Luego desinfecta el agua para beber mezclando 1 parte de esta solución madre por cada 100 partes de agua (aproximadamente 1 pinta de solución madre por cada 12.5 galones).", "caveat": "El HTH es un oxidante fuerte: manéjalo y guárdalo estrictamente según la etiqueta; no es para usuarios sin experiencia; nunca lo mezcles con otros químicos."}, "id": {"title": "Buat larutan induk klorin dari butiran kolam renang (alternatif)", "summary": "Ketika tidak ada lagi pemutih cair, butiran kalsium hipoklorit dapat dibuat menjadi larutan induk untuk desinfeksi.", "how_it_works": "Di area berventilasi, dengan memakai pelindung mata, larutkan sekitar 1 sendok teh munjung (~1/4 oz) butiran kalsium hipoklorit (HTH) dalam 2 galon air untuk membuat larutan induk (~500 mg/L). Lalu lakukan desinfeksi air minum dengan mencampur 1 bagian larutan induk ini ke dalam 100 bagian air (sekitar 1 pint larutan induk per 12.5 galon).", "caveat": "HTH adalah pengoksidasi kuat — tangani dan simpan sepenuhnya sesuai label; tidak untuk pengguna yang belum berpengalaman; jangan pernah mencampurnya dengan bahan kimia lain."}}}, {"id": "crisis-safe-water-storage", "title": "Store treated water safely", "summary": "Treated water stays safe only in clean, covered containers.", "how_it_works": "Store boiled or treated water in clean, sanitized containers with tight covers. Sanitize containers before filling, keep them off the floor, and rotate self-stored water regularly. Replace sealed commercial water by its date.", "need": "Water", "phase": ["days-after", "prolonged"], "source": "CDC", "source_url": "https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html", "caveat": "Re-contamination is common — never dip dirty hands or cups into stored water; pour instead.", "tags": ["water", "storage"], "i18n": {"es": {"title": "Almacenar de forma segura el agua tratada", "summary": "El agua tratada se mantiene segura solo en recipientes limpios y tapados.", "how_it_works": "Guarda el agua hervida o tratada en recipientes limpios y desinfectados, con tapas que cierren bien. Desinfecta los recipientes antes de llenarlos, mantenlos lejos del piso y rota con regularidad el agua que almacenes tú mismo. Reemplaza el agua comercial sellada según su fecha.", "caveat": "La recontaminación es común: nunca metas manos ni vasos sucios en el agua almacenada; mejor sírvela vertiéndola."}, "id": {"title": "Simpan air yang sudah diolah dengan aman", "summary": "Air yang sudah diolah tetap aman hanya dalam wadah yang bersih dan tertutup.", "how_it_works": "Simpan air yang sudah direbus atau diolah dalam wadah bersih yang sudah disanitasi dengan penutup rapat. Sanitasi wadah sebelum mengisinya, jauhkan dari lantai, dan rotasi air yang Anda simpan sendiri secara teratur. Ganti air kemasan komersial sebelum tanggal kedaluwarsanya.", "caveat": "Kontaminasi ulang sering terjadi — jangan pernah mencelupkan tangan atau gelas kotor ke dalam air yang disimpan; tuangkan saja."}}}, {"id": "crisis-water-minimums", "title": "Plan around minimum water quantities", "summary": "Know how much water per person per day to aim for so you ration realistically.", "how_it_works": "Humanitarian planning uses about 15 litres per person per day as the basic survival standard (drinking, cooking and hygiene combined). In acute scarcity, 7.5 litres per person per day may be tolerable for a short time, but never treat 15 litres as a maximum to aim below.", "need": "Water", "phase": ["days-after", "prolonged"], "source": "The Sphere Handbook", "source_url": "https://spherestandards.org/handbook/", "caveat": "These are survival minimums, not targets for normal life; prioritise drinking water for the sick, infants and pregnant people.", "tags": ["water", "planning", "rationing"], "i18n": {"es": {"title": "Planificar con base en las cantidades mínimas de agua", "summary": "Saber cuánta agua por persona al día debes procurar para racionar de forma realista.", "how_it_works": "La planificación humanitaria usa alrededor de 15 litres por persona al día como estándar básico de supervivencia (beber, cocinar e higiene en conjunto). En escasez aguda, 7.5 litres por persona al día puede tolerarse por un tiempo corto, pero nunca tomes los 15 litres como un máximo por debajo del cual apuntar.", "caveat": "Estos son mínimos de supervivencia, no metas para la vida normal; prioriza el agua para beber de los enfermos, los bebés y las personas embarazadas."}, "id": {"title": "Rencanakan berdasarkan jumlah air minimum", "summary": "Ketahui berapa banyak air per orang per hari yang harus dituju agar Anda menjatah secara realistis.", "how_it_works": "Perencanaan kemanusiaan menggunakan sekitar 15 litres per orang per hari sebagai standar dasar untuk bertahan hidup (gabungan minum, memasak, dan kebersihan). Dalam kelangkaan akut, 7.5 litres per orang per hari mungkin dapat ditoleransi untuk waktu singkat, tetapi jangan pernah menganggap 15 litres sebagai batas maksimum untuk dituju ke bawahnya.", "caveat": "Ini adalah minimum untuk bertahan hidup, bukan target untuk kehidupan normal; utamakan air minum untuk yang sakit, bayi, dan orang yang sedang hamil."}}}, {"id": "crisis-ors-home-recipe", "title": "Oral rehydration solution — home recipe", "summary": "A salt-and-sugar drink that treats the dehydration from diarrhoea, the biggest killer after services fail.", "how_it_works": "Only if packaged ORS is unavailable: wash hands, then in a clean container mix 1 litre of safe water + half a level small (teaspoon) measure of salt (3.5 g) + 8 small spoons / 4 big spoons of sugar (40 g). Stir until dissolved. Give frequent small sips.", "need": "Health", "phase": ["acute-72h", "days-after"], "source": "IFRC Epidemic Control Toolkit", "source_url": "https://epidemics.ifrc.org/volunteer/action/09-preparing-oral-rehydration-solution-ors", "caveat": "Packaged WHO/UNICEF ORS sachets are safer and preferred. Do NOT exceed the salt. Seek care urgently for infants, severe dehydration, blood in the stool, or if there is no improvement.", "tags": ["health", "diarrhoea", "rehydration"], "i18n": {"es": {"title": "Solución de rehidratación oral — receta casera", "summary": "Una bebida de sal y azúcar que trata la deshidratación causada por la diarrea, el mayor asesino después de que fallan los servicios.", "how_it_works": "Solo si no hay SRO en sobre disponible: lávate las manos, luego, en un recipiente limpio, mezcla 1 litro de agua segura + media medida pequeña rasa (cucharadita) de sal (3.5 g) + 8 cucharadas pequeñas / 4 cucharadas grandes de azúcar (40 g). Revuelve hasta que se disuelva. Da sorbos pequeños y frecuentes.", "caveat": "Los sobres de SRO de la OMS/UNICEF son más seguros y preferibles. NO excedas la cantidad de sal. Busca atención médica con urgencia si se trata de bebés, deshidratación grave, sangre en las heces, o si no hay mejoría."}, "id": {"title": "Larutan rehidrasi oral — resep buatan rumah", "summary": "Minuman garam-dan-gula yang mengatasi dehidrasi akibat diare, pembunuh terbesar setelah layanan publik gagal.", "how_it_works": "Hanya jika ORS kemasan tidak tersedia: cuci tangan, lalu dalam wadah bersih campurkan 1 liter air aman + setengah takaran kecil (sendok teh) rata garam (3.5 g) + 8 sendok kecil / 4 sendok besar gula (40 g). Aduk hingga larut. Berikan dalam tegukan kecil yang sering.", "caveat": "Sachet ORS kemasan WHO/UNICEF lebih aman dan lebih disarankan. JANGAN melebihi takaran garam. Segera cari pertolongan medis untuk bayi, dehidrasi berat, darah dalam tinja, atau jika tidak ada perbaikan."}}}, {"id": "crisis-ors-commercial", "title": "Use packaged WHO/UNICEF ORS when you can", "summary": "Prepackaged low-osmolarity ORS sachets are the safest first choice for rehydration.", "how_it_works": "Dissolve one sachet in exactly 1 litre of clean water. The WHO/UNICEF standard formula per litre is 2.6 g sodium chloride, 13.5 g anhydrous glucose, 1.5 g potassium chloride and 2.9 g trisodium citrate (245 mOsm/L). Stock sachets in the household kit before a crisis.", "need": "Health", "phase": ["acute-72h"], "source": "WHO / UNICEF", "source_url": "https://www.who.int/publications/i/item/WHO-FCH-CAH-06.1", "caveat": "These are manufacturer quantities for reference/procurement — do not try to weigh them at home; buy sachets.", "tags": ["health", "rehydration", "stockpile"], "i18n": {"es": {"title": "Usar SRO en sobre de la OMS/UNICEF cuando puedas", "summary": "Los sobres de SRO de baja osmolaridad, ya preparados, son la primera opción más segura para la rehidratación.", "how_it_works": "Disuelve un sobre en exactamente 1 litro de agua limpia. La fórmula estándar de la OMS/UNICEF por litro es 2.6 g de cloruro de sodio, 13.5 g de glucosa anhidra, 1.5 g de cloruro de potasio y 2.9 g de citrato trisódico (245 mOsm/L). Ten sobres almacenados en el botiquín del hogar antes de una crisis.", "caveat": "Estas son cantidades del fabricante para referencia/compra: no intentes pesarlas en casa; compra los sobres."}, "id": {"title": "Gunakan ORS kemasan WHO/UNICEF jika memungkinkan", "summary": "Sachet ORS osmolaritas-rendah yang sudah dikemas adalah pilihan pertama paling aman untuk rehidrasi.", "how_it_works": "Larutkan satu sachet dalam tepat 1 liter air bersih. Formula standar WHO/UNICEF per liter adalah 2.6 g natrium klorida, 13.5 g glukosa anhidrat, 1.5 g kalium klorida, dan 2.9 g trinatrium sitrat (245 mOsm/L). Sediakan sachet dalam kotak persediaan rumah tangga sebelum krisis terjadi.", "caveat": "Ini adalah jumlah dari pabrikan untuk rujukan/pengadaan — jangan mencoba menimbangnya di rumah; belilah sachet."}}}, {"id": "crisis-cold-chain", "title": "Keep insulin and vaccines cold without grid power", "summary": "An insulated cool box with conditioned ice packs protects temperature-sensitive medicine through a blackout.", "how_it_works": "A closed fridge holds safe temperatures for only a few hours. Move temperature-sensitive medicines into an insulated cool box with conditioned ice packs or gel bricks (can hold cold roughly 48 hours) and watch a thermometer. Target 2–8 °C; insulin must not freeze and degrades above about 25–30 °C, so never place vials directly against ice.", "need": "Health", "phase": ["acute-72h", "days-after"], "source": "WHO (cold chain principles)", "source_url": "https://www.who.int/teams/immunization-vaccines-and-biologicals/immunization-analysis-and-insights/delivery-systems/cold-chain", "caveat": "Check each product's labelled temperatures; if the cold chain is broken, ask a clinician before using or discarding.", "tags": ["health", "cold-chain", "insulin", "energy"], "i18n": {"es": {"title": "Mantener fríos la insulina y las vacunas sin energía de la red", "summary": "Una cava aislante con paquetes de hielo acondicionados protege los medicamentos sensibles a la temperatura durante un apagón.", "how_it_works": "Una nevera cerrada mantiene temperaturas seguras solo por unas pocas horas. Pasa los medicamentos sensibles a la temperatura a una cava aislante con paquetes de hielo acondicionados o ladrillos de gel (pueden mantener el frío alrededor de 48 horas) y vigila un termómetro. Apunta a 2–8 °C; la insulina no debe congelarse y se degrada por encima de unos 25–30 °C, así que nunca pongas los frascos directamente contra el hielo.", "caveat": "Revisa las temperaturas indicadas en cada producto; si se rompió la cadena de frío, consulta a un médico antes de usarlo o desecharlo."}, "id": {"title": "Jaga insulin dan vaksin tetap dingin tanpa listrik dari jaringan", "summary": "Kotak pendingin berinsulasi dengan kantong es yang sudah dikondisikan melindungi obat yang sensitif terhadap suhu selama pemadaman listrik.", "how_it_works": "Kulkas yang tertutup hanya mempertahankan suhu aman selama beberapa jam. Pindahkan obat yang sensitif terhadap suhu ke dalam kotak pendingin berinsulasi dengan kantong es atau gel beku yang sudah dikondisikan (dapat menahan dingin kira-kira 48 jam) dan pantau termometer. Targetkan 2–8 °C; insulin tidak boleh membeku dan rusak di atas sekitar 25–30 °C, jadi jangan pernah meletakkan vial langsung menempel pada es.", "caveat": "Periksa suhu yang tertera pada setiap produk; jika rantai dingin terputus, tanyakan kepada klinisi sebelum menggunakan atau membuangnya."}}}, {"id": "crisis-hand-hygiene", "title": "Hand hygiene to stop disease spreading", "summary": "Washing hands with soap is the single highest-impact act when sanitation breaks down.", "how_it_works": "Wash hands with soap and safe water at key moments — after defecation, after cleaning a child, and before handling or eating food. Where water is very scarce, use an alcohol-based hand rub. A simple tippy-tap (a hung jug tipped by a foot lever) makes a little water go a long way.", "need": "Sanitation", "phase": ["acute-72h", "days-after", "prolonged"], "source": "CDC / Hesperian", "source_url": "https://www.cdc.gov/water-emergency/safety/index.html", "caveat": "", "tags": ["sanitation", "hygiene", "outbreak-prevention"], "i18n": {"es": {"title": "Higiene de manos para frenar la propagación de enfermedades", "summary": "Lavarse las manos con jabón es la acción de mayor impacto cuando el saneamiento colapsa.", "how_it_works": "Lávate las manos con jabón y agua segura en los momentos clave: después de defecar, después de limpiar a un niño y antes de manipular o comer alimentos. Donde el agua es muy escasa, usa un gel a base de alcohol. Un sencillo tippy-tap (una jarra colgada que se inclina con una palanca accionada por el pie) hace que rinda mucho un poco de agua.", "caveat": ""}, "id": {"title": "Kebersihan tangan untuk menghentikan penyebaran penyakit", "summary": "Mencuci tangan dengan sabun adalah tindakan tunggal dengan dampak tertinggi ketika sanitasi rusak.", "how_it_works": "Cuci tangan dengan sabun dan air aman pada momen-momen penting — setelah buang air besar, setelah membersihkan anak, dan sebelum menyiapkan atau menyantap makanan. Di tempat yang airnya sangat langka, gunakan cairan pembersih tangan berbasis alkohol. Tippy-tap sederhana (kendi yang digantung dan dimiringkan dengan tuas kaki) membuat sedikit air dapat dimanfaatkan secara maksimal.", "caveat": ""}}}, {"id": "crisis-latrine-excreta", "title": "Contain excreta when sewerage fails", "summary": "Keeping human waste away from water and food prevents deadly outbreaks.", "how_it_works": "When toilets stop working, use a covered bucket or bag latrine, or dig a simple pit sited well away from and downhill of any water source. Cover waste after each use, and wash hands afterwards. Dispose of contained waste safely away from living and water areas.", "need": "Sanitation", "phase": ["days-after", "prolonged"], "source": "Hesperian / Sphere", "source_url": "https://en.hesperian.org/hhg/Sanitation_and_Cleanliness_for_a_Healthy_Environment", "caveat": "Site latrines at least the recommended distance from wells and water; protect children's contact with waste.", "tags": ["sanitation", "latrine", "excreta"], "i18n": {"es": {"title": "Contener las excretas cuando falla el alcantarillado", "summary": "Mantener los desechos humanos lejos del agua y los alimentos previene brotes mortales.", "how_it_works": "Cuando los inodoros dejan de funcionar, usa una letrina de balde tapado o de bolsa, o cava una fosa sencilla ubicada bien lejos y pendiente abajo de cualquier fuente de agua. Cubre los desechos después de cada uso y lávate las manos después. Desecha los residuos contenidos de forma segura, lejos de las zonas de vivienda y de agua.", "caveat": "Ubica las letrinas al menos a la distancia recomendada de los pozos y del agua; protege a los niños del contacto con los desechos."}, "id": {"title": "Tampung kotoran manusia ketika saluran pembuangan gagal", "summary": "Menjauhkan limbah manusia dari air dan makanan mencegah wabah yang mematikan.", "how_it_works": "Ketika toilet berhenti berfungsi, gunakan jamban ember atau kantong bertutup, atau gali lubang sederhana yang letaknya jauh dari dan lebih rendah daripada sumber air mana pun. Tutup limbah setiap selesai digunakan, dan cuci tangan setelahnya. Buang limbah yang sudah ditampung secara aman jauh dari area tempat tinggal dan air.", "caveat": "Tempatkan jamban setidaknya pada jarak yang dianjurkan dari sumur dan sumber air; lindungi anak-anak dari kontak dengan limbah."}}}, {"id": "crisis-greywater", "title": "Manage greywater so it doesn't make you sick", "summary": "Used washing and cooking water must not pool near homes or reach drinking water.", "how_it_works": "Keep used washing and cooking water from pooling near dwellings, where it breeds mosquitoes, and out of any drinking-water source. Reuse it for flushing or cleaning, and drain the rest to a simple soak pit.", "need": "Sanitation", "phase": ["prolonged"], "source": "Hesperian / Appropedia", "source_url": "https://www.appropedia.org/Greywater", "caveat": "Do not reuse greywater on food crops without proper treatment.", "tags": ["sanitation", "greywater", "mosquito-control"], "i18n": {"es": {"title": "Manejar las aguas grises para que no te enfermen", "summary": "El agua usada de lavar y cocinar no debe acumularse cerca de las casas ni llegar al agua para beber.", "how_it_works": "Evita que el agua usada de lavar y cocinar se acumule cerca de las viviendas, donde cría mosquitos, y que llegue a cualquier fuente de agua para beber. Reutilízala para descargar el inodoro o para limpiar, y drena el resto hacia un sencillo pozo de absorción.", "caveat": "No reutilices las aguas grises en cultivos de alimentos sin un tratamiento adecuado."}, "id": {"title": "Kelola air bekas agar tidak membuat Anda sakit", "summary": "Air bekas mencuci dan memasak tidak boleh menggenang di dekat rumah atau mencapai air minum.", "how_it_works": "Cegah air bekas mencuci dan memasak menggenang di dekat tempat tinggal, tempat air itu menjadi sarang nyamuk, dan jauhkan dari sumber air minum mana pun. Gunakan kembali untuk menyiram atau membersihkan, dan alirkan sisanya ke lubang resapan sederhana.", "caveat": "Jangan menggunakan kembali air bekas pada tanaman pangan tanpa pengolahan yang tepat."}}}, {"id": "crisis-lighting-small-power", "title": "Lighting and small power through blackouts", "summary": "Keep lights, phones and medical devices running with batteries, an inverter or solar.", "how_it_works": "Bridge outages with LED lamps, USB power banks, a 12 V battery plus an inverter, or a small solar panel with a charge controller. Prioritise the loads that matter — light, phone charging, a medical device — and size the battery and inverter to those loads.", "need": "Power", "phase": ["days-after", "prolonged"], "source": "Appropedia / MIT D-Lab", "source_url": "https://www.appropedia.org/Solar_power", "caveat": "NEVER run a fuel generator indoors or in an enclosed space — carbon monoxide kills.", "tags": ["energy", "solar", "battery", "off-grid"], "i18n": {"es": {"title": "Iluminación y energía pequeña durante los apagones", "summary": "Mantén luces, teléfonos y dispositivos médicos funcionando con baterías, un inversor o energía solar.", "how_it_works": "Sortea los cortes con lámparas LED, baterías portátiles USB, una batería de 12 V más un inversor, o un pequeño panel solar con un controlador de carga. Prioriza las cargas que importan (luz, carga del teléfono, un dispositivo médico) y dimensiona la batería y el inversor según esas cargas.", "caveat": "NUNCA hagas funcionar un generador de combustible dentro de la casa ni en un espacio cerrado: el monóxido de carbono mata."}, "id": {"title": "Penerangan dan listrik kecil saat pemadaman", "summary": "Jaga lampu, ponsel, dan perangkat medis tetap menyala dengan baterai, inverter, atau tenaga surya.", "how_it_works": "Atasi pemadaman dengan lampu LED, power bank USB, baterai 12 V ditambah inverter, atau panel surya kecil dengan pengendali pengisian. Utamakan beban yang penting — penerangan, pengisian ponsel, perangkat medis — dan sesuaikan ukuran baterai serta inverter dengan beban tersebut.", "caveat": "JANGAN PERNAH menjalankan generator berbahan bakar di dalam ruangan atau ruang tertutup — karbon monoksida mematikan."}}}, {"id": "crisis-cooking-without-gas", "title": "Cook when there's no gas or power", "summary": "Fuel-efficient and solar cookers let you keep cooking and boiling water off-grid.", "how_it_works": "Use a fuel-efficient improved cookstove, a charcoal or wood rocket stove, or a solar cooker where the sun is strong. The same fire also boils water for disinfection. Always ventilate to avoid smoke and carbon-monoxide build-up.", "need": "Food", "phase": ["days-after", "prolonged"], "source": "MIT D-Lab / Appropedia", "source_url": "https://d-lab.mit.edu/research/work-themes/biomass-fuel-cookstoves", "caveat": "Never burn charcoal or fuel indoors without ventilation.", "tags": ["energy", "cooking", "rocket-stove", "solar"], "i18n": {"es": {"title": "Cocinar cuando no hay gas ni electricidad", "summary": "Las cocinas eficientes en combustible y las cocinas solares te permiten seguir cocinando y hirviendo agua fuera de la red.", "how_it_works": "Usa una cocina mejorada eficiente en combustible, una cocina cohete de carbón o leña, o una cocina solar donde el sol sea fuerte. El mismo fuego también hierve agua para desinfectarla. Ventila siempre para evitar la acumulación de humo y de monóxido de carbono.", "caveat": "Nunca quemes carbón ni combustible dentro de la casa sin ventilación."}, "id": {"title": "Memasak ketika tidak ada gas atau listrik", "summary": "Kompor hemat bahan bakar dan kompor surya memungkinkan Anda tetap memasak dan merebus air tanpa jaringan listrik.", "how_it_works": "Gunakan kompor hemat bahan bakar yang lebih baik, kompor roket arang atau kayu, atau kompor surya di tempat yang sinar mataharinya kuat. Api yang sama juga merebus air untuk desinfeksi. Selalu beri ventilasi untuk menghindari penumpukan asap dan karbon monoksida.", "caveat": "Jangan pernah membakar arang atau bahan bakar di dalam ruangan tanpa ventilasi."}}}, {"id": "crisis-food-without-fridge", "title": "Keep food safe without refrigeration", "summary": "Eat, preserve, or protect perishable food before it spoils when the fridge is off.", "how_it_works": "When the fridge is down, eat the most perishable food first, and preserve the rest by drying, salting, fermenting, or cooking and eating it the same day. Keep the fridge and freezer doors closed to hold cold as long as possible; freezing bottles of water in advance buys extra hours.", "need": "Food", "phase": ["days-after", "prolonged"], "source": "American Red Cross / Appropedia", "source_url": "https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/food-safety.html", "caveat": "When in doubt, throw it out — discard perishable food kept above 4 °C for more than 2 hours.", "tags": ["food", "preservation", "no-refrigeration"], "i18n": {"es": {"title": "Mantener los alimentos seguros sin refrigeración", "summary": "Come, conserva o protege los alimentos perecederos antes de que se dañen cuando la nevera está apagada.", "how_it_works": "Cuando la nevera está apagada, come primero los alimentos más perecederos y conserva el resto secándolo, salándolo, fermentándolo, o cocinándolo y comiéndolo el mismo día. Mantén cerradas las puertas de la nevera y el congelador para conservar el frío el mayor tiempo posible; congelar botellas de agua de antemano te da horas extra.", "caveat": "En caso de duda, deséchalo: bota los alimentos perecederos que hayan estado por encima de 4 °C durante más de 2 hours."}, "id": {"title": "Jaga makanan tetap aman tanpa pendinginan", "summary": "Makan, awetkan, atau lindungi makanan yang mudah busuk sebelum rusak ketika kulkas mati.", "how_it_works": "Ketika kulkas mati, makan dulu makanan yang paling mudah busuk, dan awetkan sisanya dengan mengeringkan, menggarami, memfermentasi, atau memasak dan menyantapnya pada hari yang sama. Jaga pintu kulkas dan freezer tetap tertutup untuk mempertahankan dingin selama mungkin; membekukan botol berisi air sebelumnya memberi waktu tambahan beberapa jam.", "caveat": "Jika ragu, buang saja — buang makanan mudah busuk yang disimpan di atas 4 °C selama lebih dari 2 hours."}}}, {"id": "crisis-keep-phones-alive", "title": "Keep phones and contact alive", "summary": "Stretch battery and agree how to reach each other before networks get congested.", "how_it_works": "Lower screen brightness, switch to airplane mode between check-ins, and share power banks. Pre-download offline maps. Agree a family check-in protocol and a single out-of-area contact everyone messages, since local lines clog first.", "need": "Comms", "phase": ["acute-72h"], "source": "American Red Cross", "source_url": "https://www.redcross.org/get-help/how-to-prepare-for-emergencies.html", "caveat": "", "tags": ["comms", "phones", "battery"], "i18n": {"es": {"title": "Mantener vivos los teléfonos y el contacto", "summary": "Alarga la batería y acuerden cómo localizarse antes de que las redes se congestionen.", "how_it_works": "Baja el brillo de la pantalla, cambia a modo avión entre cada contacto, y compartan baterías portátiles. Descarga mapas sin conexión de antemano. Acuerden un protocolo familiar de contacto y un único contacto fuera de la zona al que todos le escriban, ya que las líneas locales se saturan primero.", "caveat": ""}, "id": {"title": "Jaga ponsel dan komunikasi tetap hidup", "summary": "Hemat baterai dan sepakati cara saling menghubungi sebelum jaringan menjadi padat.", "how_it_works": "Turunkan kecerahan layar, beralih ke mode pesawat di antara waktu saling mengabari, dan berbagi power bank. Unduh peta luring sebelumnya. Sepakati protokol saling mengabari keluarga dan satu kontak di luar wilayah yang dihubungi semua orang lewat pesan, karena saluran lokal akan tersumbat lebih dulu.", "caveat": ""}}}, {"id": "crisis-meshtastic", "title": "Off-grid mesh messaging (Meshtastic)", "summary": "Low-cost radios pass encrypted texts with no cell network or internet.", "how_it_works": "Meshtastic uses inexpensive long-range LoRa radios that form a peer-to-peer mesh, relaying encrypted text messages between devices with no cell network or internet. Range is typically several kilometres, more with an elevated antenna.", "need": "Comms", "phase": ["days-after", "prolonged"], "source": "Meshtastic (open source)", "source_url": "https://meshtastic.org", "caveat": "Requires hardware and setup acquired BEFORE the crisis — stage it in advance.", "tags": ["comms", "mesh", "lora", "off-grid"], "i18n": {"es": {"title": "Mensajería en malla fuera de la red (Meshtastic)", "summary": "Radios de bajo costo transmiten textos cifrados sin red celular ni internet.", "how_it_works": "Meshtastic usa radios LoRa de largo alcance y bajo costo que forman una malla punto a punto, retransmitiendo mensajes de texto cifrados entre dispositivos sin red celular ni internet. El alcance suele ser de varios kilómetros, y mayor con una antena elevada.", "caveat": "Requiere hardware y configuración conseguidos ANTES de la crisis: déjalo listo con anticipación."}, "id": {"title": "Pesan mesh tanpa jaringan (Meshtastic)", "summary": "Radio murah meneruskan pesan teks terenkripsi tanpa jaringan seluler atau internet.", "how_it_works": "Meshtastic menggunakan radio LoRa jangkauan-jauh yang murah yang membentuk jaringan mesh peer-to-peer, meneruskan pesan teks terenkripsi antarperangkat tanpa jaringan seluler atau internet. Jangkauannya biasanya beberapa kilometer, lebih jauh lagi dengan antena yang ditinggikan.", "caveat": "Memerlukan perangkat keras dan pengaturan yang diperoleh SEBELUM krisis — siapkan terlebih dahulu."}}}, {"id": "crisis-briar", "title": "Phone-to-phone messaging when networks fail (Briar)", "summary": "An app that connects phones directly over Bluetooth or Wi-Fi during outages.", "how_it_works": "Briar is an Android app that connects phones directly over Bluetooth or Wi-Fi (and via Tor when the internet is available), so messaging keeps working during network outages or shutdowns. Install it and add your contacts before you need it.", "need": "Comms", "phase": ["days-after", "prolonged"], "source": "Briar Project (open source)", "source_url": "https://briarproject.org", "caveat": "Bluetooth range is short (tens of metres); set up contacts in advance.", "tags": ["comms", "bluetooth", "off-grid", "messaging"], "i18n": {"es": {"title": "Mensajería de teléfono a teléfono cuando fallan las redes (Briar)", "summary": "Una aplicación que conecta los teléfonos directamente por Bluetooth o Wi-Fi durante los cortes.", "how_it_works": "Briar es una aplicación de Android que conecta los teléfonos directamente por Bluetooth o Wi-Fi (y a través de Tor cuando hay internet disponible), de modo que la mensajería sigue funcionando durante los cortes de red o los apagones de internet. Instálala y agrega tus contactos antes de necesitarla.", "caveat": "El alcance del Bluetooth es corto (decenas de metros); configura los contactos con anticipación."}, "id": {"title": "Pesan antarponsel ketika jaringan gagal (Briar)", "summary": "Aplikasi yang menghubungkan ponsel secara langsung lewat Bluetooth atau Wi-Fi selama pemadaman.", "how_it_works": "Briar adalah aplikasi Android yang menghubungkan ponsel secara langsung lewat Bluetooth atau Wi-Fi (dan lewat Tor ketika internet tersedia), sehingga perpesanan tetap berfungsi selama pemadaman jaringan atau pemblokiran. Pasang aplikasinya dan tambahkan kontak Anda sebelum Anda membutuhkannya.", "caveat": "Jangkauan Bluetooth pendek (puluhan meter); siapkan kontak terlebih dahulu."}}}, {"id": "crisis-ushahidi", "title": "Crowdsourced needs mapping (Ushahidi)", "summary": "Collect incident and needs reports onto a live map to direct help.", "how_it_works": "Ushahidi is open-source software that crowdsources incident and needs reports — by SMS or web — onto a live map, so a community or responders can see where water, medicine or rescue is needed and direct mutual aid.", "need": "Coordination", "phase": ["acute-72h", "days-after"], "source": "Ushahidi (open source)", "source_url": "https://www.ushahidi.com", "caveat": "", "tags": ["coordination", "crisis-mapping", "mutual-aid"], "i18n": {"es": {"title": "Mapeo colaborativo de necesidades (Ushahidi)", "summary": "Recopila reportes de incidentes y necesidades en un mapa en vivo para dirigir la ayuda.", "how_it_works": "Ushahidi es un software de código abierto que recopila de forma colaborativa reportes de incidentes y necesidades (por SMS o web) en un mapa en vivo, de modo que una comunidad o los equipos de respuesta puedan ver dónde se necesita agua, medicinas o rescate y dirigir la ayuda mutua.", "caveat": ""}, "id": {"title": "Pemetaan kebutuhan dari urun daya (Ushahidi)", "summary": "Kumpulkan laporan insiden dan kebutuhan ke dalam peta langsung untuk mengarahkan bantuan.", "how_it_works": "Ushahidi adalah perangkat lunak sumber terbuka yang mengurun-dayakan laporan insiden dan kebutuhan — lewat SMS atau web — ke dalam peta langsung, sehingga komunitas atau petugas tanggap darurat dapat melihat di mana air, obat, atau penyelamatan dibutuhkan dan mengarahkan bantuan gotong royong.", "caveat": ""}}}, {"id": "crisis-hot-maps", "title": "Open base maps for response (HOT)", "summary": "Volunteers trace buildings and roads so responders have usable maps.", "how_it_works": "The Humanitarian OpenStreetMap Team coordinates volunteers to trace buildings, roads and infrastructure from satellite imagery, producing free, open maps of affected areas that neighbourhood groups and responders can actually use.", "need": "Coordination", "phase": ["days-after"], "source": "Humanitarian OpenStreetMap Team", "source_url": "https://www.hotosm.org", "caveat": "", "tags": ["coordination", "mapping", "open-data"], "i18n": {"es": {"title": "Mapas base abiertos para la respuesta (HOT)", "summary": "Voluntarios trazan edificios y vías para que los equipos de respuesta tengan mapas utilizables.", "how_it_works": "El Humanitarian OpenStreetMap Team coordina a voluntarios para trazar edificios, vías e infraestructura a partir de imágenes satelitales, produciendo mapas libres y abiertos de las zonas afectadas que los grupos del barrio y los equipos de respuesta sí pueden usar.", "caveat": ""}, "id": {"title": "Peta dasar terbuka untuk tanggap darurat (HOT)", "summary": "Relawan menggambar bangunan dan jalan sehingga petugas tanggap darurat memiliki peta yang dapat digunakan.", "how_it_works": "Humanitarian OpenStreetMap Team mengoordinasikan relawan untuk menggambar bangunan, jalan, dan infrastruktur dari citra satelit, menghasilkan peta terbuka dan gratis dari area terdampak yang benar-benar dapat digunakan oleh kelompok lingkungan dan petugas tanggap darurat.", "caveat": ""}}}, {"id": "crisis-mutual-aid", "title": "Neighbourhood mutual-aid committee", "summary": "An organised block keeps everyone alive through prolonged degraded services.", "how_it_works": "Stand up a block or building committee: keep a roster of vulnerable residents, set up a shared water and phone-charging point, run a message board, and agree simple signals. This community backbone is what carries people through weeks of degraded services.", "need": "Coordination", "phase": ["days-after", "prolonged"], "source": "IFRC / Sphere", "source_url": "https://www.ifrc.org/our-work/disasters-climate-and-crises/community-engagement-and-accountability", "caveat": "", "tags": ["coordination", "mutual-aid", "community"], "i18n": {"es": {"title": "Comité vecinal de ayuda mutua", "summary": "Una cuadra organizada mantiene a todos con vida durante servicios degradados prolongados.", "how_it_works": "Conforma un comité de cuadra o de edificio: lleva un registro de los residentes vulnerables, monta un punto compartido de agua y de carga de teléfonos, mantén una cartelera de mensajes y acuerden señales sencillas. Esta columna comunitaria es lo que sostiene a la gente a lo largo de semanas de servicios degradados.", "caveat": ""}, "id": {"title": "Komite gotong royong lingkungan", "summary": "Lingkungan yang terorganisir menjaga semua orang tetap hidup melalui layanan yang menurun secara berkepanjangan.", "how_it_works": "Bentuk komite blok atau gedung: simpan daftar warga rentan, siapkan titik berbagi air dan pengisian ponsel, jalankan papan pesan, dan sepakati isyarat sederhana. Tulang punggung komunitas inilah yang membawa orang-orang melewati berminggu-minggu layanan yang menurun.", "caveat": ""}}}, {"id": "crisis-secure-building-after-quake", "title": "Check a building before re-entering after a quake", "summary": "Quick triage of structural and gas hazards before you go back inside.", "how_it_works": "Before re-entering after an earthquake, check for a gas smell, leaning walls, large cracks, and sagging floors or ceilings. If you suspect a gas leak, shut off the gas — and do NOT switch electrics on or off if you smell gas. Stay out of any visibly damaged structure until it is inspected.", "need": "Shelter", "phase": ["acute-72h"], "source": "American Red Cross", "source_url": "https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/earthquake.html", "caveat": "This is triage only — real structural safety needs a qualified inspector.", "tags": ["shelter", "earthquake", "safety"], "i18n": {"es": {"title": "Revisar un edificio antes de volver a entrar tras un sismo", "summary": "Una evaluación rápida de los peligros estructurales y de gas antes de volver a entrar.", "how_it_works": "Antes de volver a entrar después de un terremoto, revisa si hay olor a gas, paredes inclinadas, grietas grandes y pisos o techos hundidos. Si sospechas una fuga de gas, cierra el gas; y NO enciendas ni apagues nada eléctrico si hueles gas. Mantente fuera de cualquier estructura visiblemente dañada hasta que sea inspeccionada.", "caveat": "Esto es solo una evaluación rápida: la verdadera seguridad estructural requiere un inspector calificado."}, "id": {"title": "Periksa bangunan sebelum masuk kembali setelah gempa", "summary": "Triase cepat terhadap bahaya struktural dan gas sebelum Anda masuk kembali ke dalam.", "how_it_works": "Sebelum masuk kembali setelah gempa bumi, periksa adanya bau gas, dinding yang miring, retakan besar, dan lantai atau langit-langit yang melendut. Jika Anda mencurigai ada kebocoran gas, tutup katup gas — dan JANGAN menyalakan atau mematikan listrik jika Anda mencium bau gas. Tetaplah di luar bangunan yang terlihat rusak sampai diperiksa.", "caveat": "Ini hanya triase — keamanan struktural yang sebenarnya memerlukan pemeriksa yang berkualifikasi."}}}, {"id": "oshwa-umbilical-cord-clamp", "title": "3D-printed umbilical cord clamp", "summary": "A printable clamp that seals a newborn's umbilical cord to prevent infection.", "how_it_works": "It replaces the commercial plastic cord clamp that hospitals run out of after a disaster, when staff improvise with shoelaces or glove fingers. Printed from a single piece of filament on any desktop FDM printer, it snaps shut over the cord to stop bleeding and reduce sepsis risk in the first minutes of life.", "need": "Health", "phase": ["days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000203.html", "oshwa_uid": "US000203", "open_hardware": true, "caveat": "Clinical device for skilled birth attendants; print in a clean material and follow sterilisation/aseptic practice before use on a newborn.", "tags": ["open-hardware", "3d-printing", "maternal-health", "medical-consumable"], "i18n": {"es": {"title": "Pinza para cordón umbilical impresa en 3D", "summary": "Una pinza imprimible que sella el cordón umbilical de un recién nacido para prevenir infecciones.", "how_it_works": "Reemplaza la pinza plástica comercial para cordón que se les agota a los hospitales después de un desastre, cuando el personal improvisa con cordones de zapatos o dedos de guantes. Impresa de una sola pieza de filamento en cualquier impresora FDM de escritorio, se cierra de golpe sobre el cordón para detener el sangrado y reducir el riesgo de sepsis en los primeros minutos de vida.", "caveat": "Dispositivo clínico para personal capacitado en atención del parto; imprímela en un material limpio y sigue prácticas de esterilización/asepsia antes de usarla en un recién nacido."}, "id": {"title": "Klem tali pusar cetak-3D", "summary": "Klem yang dapat dicetak yang menutup tali pusar bayi baru lahir untuk mencegah infeksi.", "how_it_works": "Klem ini menggantikan klem tali pusar plastik komersial yang habis stoknya di rumah sakit setelah bencana, ketika petugas terpaksa berimprovisasi dengan tali sepatu atau jari sarung tangan. Dicetak dari satu potong filamen pada printer FDM desktop mana pun, klem ini menutup rapat pada tali pusar untuk menghentikan pendarahan dan mengurangi risiko sepsis pada menit-menit pertama kehidupan.", "caveat": "Perangkat klinis untuk penolong persalinan terampil; cetak dengan material yang bersih dan ikuti praktik sterilisasi/aseptik sebelum digunakan pada bayi baru lahir."}}}, {"id": "oshwa-oxygen-supply-fitting", "title": "Oxygen supply fitting", "summary": "An adapter that connects oxygen tubing to standard oxygen systems.", "how_it_works": "When a clinic's oxygen delivery fails for want of a small proprietary connector, this printed adapter bridges supply tubing to standard oxygen equipment. It is a 3D-printed part that lets existing cylinders, concentrators and tubing keep working instead of sitting idle.", "need": "Health", "phase": ["acute-72h", "days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000204.html", "oshwa_uid": "US000204", "open_hardware": true, "caveat": "Oxygen-delivery component; verify fit, leak-tightness and material compatibility with a clinician before patient use.", "tags": ["open-hardware", "3d-printing", "oxygen", "medical-device"], "i18n": {"es": {"title": "Conector para suministro de oxígeno", "summary": "Un adaptador que conecta las mangueras de oxígeno a los sistemas de oxígeno estándar.", "how_it_works": "Cuando el suministro de oxígeno de una clínica falla por falta de un pequeño conector propietario, este adaptador impreso une las mangueras de suministro al equipo de oxígeno estándar. Es una pieza impresa en 3D que permite que los cilindros, concentradores y mangueras existentes sigan funcionando en vez de quedar inservibles.", "caveat": "Componente de suministro de oxígeno; verifica el ajuste, la hermeticidad y la compatibilidad del material con un médico antes de usarlo en un paciente."}, "id": {"title": "Sambungan pasokan oksigen", "summary": "Adaptor yang menghubungkan selang oksigen ke sistem oksigen standar.", "how_it_works": "Ketika pengiriman oksigen di klinik gagal karena kurangnya satu konektor kepemilikan kecil, adaptor cetak ini menjembatani selang pasokan ke peralatan oksigen standar. Ini adalah bagian cetak-3D yang membuat tabung, konsentrator, dan selang yang ada tetap berfungsi alih-alih dibiarkan menganggur.", "caveat": "Komponen pengiriman oksigen; verifikasi kecocokan, kerapatan terhadap kebocoran, dan kompatibilitas material dengan klinisi sebelum digunakan pada pasien."}}}, {"id": "oshwa-oropharyngeal-airway", "title": "Oropharyngeal airway (OPA)", "summary": "A printable airway device that keeps an unconscious patient's airway open.", "how_it_works": "An OPA holds the tongue clear of the throat so an unresponsive patient can keep breathing — a basic emergency-care item that stockpiles run short of after mass-casualty events. It is printed to standard airway sizing on a desktop printer, giving responders a locally made supply when imported stock is gone.", "need": "Health", "phase": ["acute-72h", "days-after"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000221.html", "oshwa_uid": "US000221", "open_hardware": true, "caveat": "Airway-management device; for use by trained personnel only, with correct sizing and a biocompatible, properly finished material.", "tags": ["open-hardware", "3d-printing", "emergency-care", "medical-device"], "i18n": {"es": {"title": "Cánula orofaríngea (OPA)", "summary": "Un dispositivo de vía aérea imprimible que mantiene abierta la vía aérea de un paciente inconsciente.", "how_it_works": "Una OPA mantiene la lengua apartada de la garganta para que un paciente que no responde pueda seguir respirando: un artículo básico de atención de emergencia que se les agota a las reservas después de eventos con muchas víctimas. Se imprime según las tallas estándar de vía aérea en una impresora de escritorio, dando a los equipos de respuesta un suministro de fabricación local cuando se acaba el material importado.", "caveat": "Dispositivo de manejo de la vía aérea; para uso únicamente por personal capacitado, con la talla correcta y un material biocompatible y bien acabado."}, "id": {"title": "Jalan napas orofaringeal (OPA)", "summary": "Perangkat jalan napas yang dapat dicetak yang menjaga jalan napas pasien tidak sadar tetap terbuka.", "how_it_works": "OPA menahan lidah agar tidak menutup tenggorokan sehingga pasien yang tidak responsif dapat terus bernapas — barang perawatan darurat dasar yang stoknya kerap habis setelah peristiwa korban massal. Perangkat ini dicetak sesuai ukuran jalan napas standar pada printer desktop, memberi petugas tanggap darurat pasokan buatan lokal ketika stok impor sudah habis.", "caveat": "Perangkat pengelolaan jalan napas; hanya untuk digunakan oleh personel terlatih, dengan ukuran yang tepat dan material yang biokompatibel serta diselesaikan dengan benar."}}}, {"id": "oshwa-otoscope-specula", "title": "Otoscope specula", "summary": "Printable ear specula for examining the ear canal and eardrum.", "how_it_works": "Otoscope tips are disposable and quickly run out in field clinics, halting basic ear exams. These specula print cheaply in batches on a desktop printer and clip onto an otoscope so a clinician can keep inspecting the external canal and eardrum.", "need": "Health", "phase": ["days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000208.html", "oshwa_uid": "US000208", "open_hardware": true, "caveat": "Patient-contact part; clean and disinfect appropriately between patients and use a suitable material.", "tags": ["open-hardware", "3d-printing", "diagnostics", "medical-consumable"], "i18n": {"es": {"title": "Espéculos para otoscopio", "summary": "Espéculos óticos imprimibles para examinar el canal auditivo y el tímpano.", "how_it_works": "Las puntas de otoscopio son desechables y se agotan rápido en las clínicas de campo, deteniendo los exámenes básicos de oído. Estos espéculos se imprimen de forma económica por lotes en una impresora de escritorio y se acoplan a un otoscopio para que un médico pueda seguir inspeccionando el canal externo y el tímpano.", "caveat": "Pieza en contacto con el paciente; limpia y desinfecta de forma adecuada entre pacientes y usa un material apropiado."}, "id": {"title": "Spekulum otoskop", "summary": "Spekulum telinga yang dapat dicetak untuk memeriksa saluran telinga dan gendang telinga.", "how_it_works": "Ujung otoskop bersifat sekali pakai dan cepat habis di klinik lapangan, menghentikan pemeriksaan telinga dasar. Spekulum ini dicetak murah dalam jumlah banyak pada printer desktop dan dipasang pada otoskop sehingga klinisi dapat terus memeriksa saluran telinga luar dan gendang telinga.", "caveat": "Bagian yang bersentuhan dengan pasien; bersihkan dan disinfeksi secara tepat di antara pasien dan gunakan material yang sesuai."}}}, {"id": "oshwa-syphon-handwash-station", "title": "Syphon handwash station", "summary": "A foot-operated portable handwashing unit built from a simple bucket syphon.", "how_it_works": "After a disaster, hands-free handwashing slows disease spread but plumbed sinks are rare. This unit turns an ordinary bucket into a foot-operated syphon: 3D-printed parts plus a bucket let people wash without touching a tap, and it can be deployed anywhere water can be carried.", "need": "Sanitation", "phase": ["days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000631.html", "oshwa_uid": "US000631", "open_hardware": true, "caveat": "", "tags": ["open-hardware", "3d-printing", "wash", "hygiene"], "i18n": {"es": {"title": "Estación de lavado de manos con sifón", "summary": "Una unidad portátil de lavado de manos accionada con el pie, construida a partir de un sencillo sifón de balde.", "how_it_works": "Después de un desastre, el lavado de manos sin contacto frena la propagación de enfermedades, pero los lavamanos con tubería son escasos. Esta unidad convierte un balde común en un sifón accionado con el pie: piezas impresas en 3D más un balde permiten que la gente se lave sin tocar una llave, y puede instalarse en cualquier lugar al que se pueda llevar agua.", "caveat": ""}, "id": {"title": "Stasiun cuci tangan sifon", "summary": "Unit cuci tangan portabel yang dioperasikan dengan kaki, dibuat dari sifon ember sederhana.", "how_it_works": "Setelah bencana, cuci tangan tanpa sentuh memperlambat penyebaran penyakit tetapi wastafel berpipa langka. Unit ini mengubah ember biasa menjadi sifon yang dioperasikan dengan kaki: bagian cetak-3D ditambah ember memungkinkan orang mencuci tangan tanpa menyentuh keran, dan dapat dipasang di mana saja air bisa dibawa.", "caveat": ""}}}, {"id": "oshwa-foot-operated-tap", "title": "Foot-operated tap", "summary": "A hands-free tap that fits under an existing sink and screws into the plumbing.", "how_it_works": "It retrofits an ordinary sink for hands-free use, cutting contamination at the tap during outbreaks and water-scarce conditions. The 3D-printed unit sits under the sink and screws into existing plumbing, so a foot pedal controls the flow instead of hands on a handle.", "need": "Sanitation", "phase": ["days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000630.html", "oshwa_uid": "US000630", "open_hardware": true, "caveat": "", "tags": ["open-hardware", "3d-printing", "wash", "hygiene"], "i18n": {"es": {"title": "Grifo accionado con el pie", "summary": "Un grifo sin contacto que se instala debajo de un lavamanos existente y se enrosca a la tubería.", "how_it_works": "Adapta un lavamanos común para uso sin manos, reduciendo la contaminación en el grifo durante los brotes y en condiciones de escasez de agua. La unidad impresa en 3D se ubica debajo del lavamanos y se enrosca a la tubería existente, de modo que un pedal controla el flujo en lugar de las manos sobre una llave.", "caveat": ""}, "id": {"title": "Keran yang dioperasikan dengan kaki", "summary": "Keran tanpa sentuh yang dipasang di bawah wastafel yang ada dan disekrupkan ke pipa.", "how_it_works": "Keran ini memodifikasi wastafel biasa untuk penggunaan tanpa sentuh, mengurangi kontaminasi di keran selama wabah dan kondisi kelangkaan air. Unit cetak-3D ini diletakkan di bawah wastafel dan disekrupkan ke pipa yang ada, sehingga pedal kaki mengendalikan aliran alih-alih tangan pada gagang keran.", "caveat": ""}}}, {"id": "oshwa-pipe-t-piece", "title": "Water pipe T-piece", "summary": "A printable T-junction that joins three flexible pipes.", "how_it_works": "Repairing or branching a water line stalls when a single fitting is missing and none can be bought. This T-piece prints on a desktop printer and joins three flexible pipes (silicone or PVC, 4-7 mm inner diameter), letting communities mend and extend water and tubing runs locally.", "need": "Water", "phase": ["days-after", "prolonged"], "source": "Field Ready (OSHWA-certified)", "source_url": "https://certification.oshwa.org/us000181.html", "oshwa_uid": "US000181", "open_hardware": true, "caveat": "", "tags": ["open-hardware", "3d-printing", "water-supply", "pipe-fitting"], "i18n": {"es": {"title": "Pieza en T para tubería de agua", "summary": "Una unión en T imprimible que une tres tubos flexibles.", "how_it_works": "Reparar o ramificar una línea de agua se detiene cuando falta un solo conector y no se puede comprar ninguno. Esta pieza en T se imprime en una impresora de escritorio y une tres tubos flexibles (silicona o PVC, de 4-7 mm de diámetro interno), permitiendo que las comunidades reparen y extiendan localmente sus líneas de agua y mangueras.", "caveat": ""}, "id": {"title": "Sambungan T pipa air", "summary": "Sambungan-T yang dapat dicetak yang menyatukan tiga pipa fleksibel.", "how_it_works": "Memperbaiki atau mencabangkan saluran air terhambat ketika satu sambungan hilang dan tidak ada yang bisa dibeli. Sambungan-T ini dicetak pada printer desktop dan menyatukan tiga pipa fleksibel (silikon atau PVC, diameter dalam 4-7 mm), memungkinkan komunitas memperbaiki dan memperpanjang jalur air dan selang secara lokal.", "caveat": ""}}}, {"id": "crisis-bitchat", "need": "Comms", "phase": ["acute-72h", "days-after", "prolonged"], "title": "Phone-to-phone messaging, no internet (bitchat)", "summary": "A free app that relays encrypted messages phone-to-phone over Bluetooth mesh — no SIM, internet, servers or account.", "source": "bitchat (open source)", "source_url": "https://github.com/permissionlesstech/bitchat", "open_hardware": false, "i18n": {"es": {"title": "Mensajería de teléfono a teléfono, sin internet (bitchat)", "summary": "App gratuita que pasa mensajes cifrados de teléfono a teléfono por malla Bluetooth — sin SIM, internet, servidores ni cuenta."}, "id": {"title": "Pesan antar-ponsel, tanpa internet (bitchat)", "summary": "Aplikasi gratis yang meneruskan pesan terenkripsi antar ponsel lewat mesh Bluetooth — tanpa SIM, internet, server, atau akun."}}}]};

  h+=`<div class="vp-block"><h3>${esc(ui("print_files_h"))}</h3><div class="vp-files">`+p.files.map(f=>`<a class="vp-file" data-ev="download" href="${esc(f.href)}" download>${esc(f.label)}<i>${esc(ui("print_download"))} &#8595;</i></a>`).join("")+`</div></div>`;

  h+=`<div class="vp-block"><h3>${esc(ui("print_use_h"))}</h3><ol class="vp-steps">`+steps.map(s=>`<li>${esc(s)}</li>`).join("")+`</ol><p class="vp-caveat">${esc(ui("print_caveat"))}</p></div>`;
  const com=DATA.venezuela&&DATA.venezuela.community;
  if(com&&com.items&&com.items.length){
    h+=`<div class="vp-block vp-community"><h3>${esc(ui("community_h"))}</h3><p class="vp-mat">${esc(ui("community_lead"))}</p><div class="vp-fr">`+com.items.map(function(x){var href=x.download||x.url||"#";var tag=x.download?(esc(ui("print_download"))+" &#8595;"):(esc(x.tag||"")+" &#8599;");return `<a class="vp-fritem" data-ev="${x.download?'download':'community'}" href="${esc(href)}"${x.download?' download':' target="_blank" rel="noopener"'}><b>${esc(x.name)}</b><span>${esc(pick(x,"what"))}${x.author?(" &middot; "+esc(x.author)):""}</span><em>${tag}</em></a>`;}).join("")+`</div></div>`;
  }
  h+=`<div class="vp-block"><h3>${esc(ui("print_materials_h"))}</h3><p class="vp-mat">${esc(ui("print_materials"))}</p></div>`;
  const fr=DATA.venezuela.fieldready;
  if(fr&&fr.items&&fr.items.length){
    h+=`<div class="vp-block"><h3>${esc(ui("fr_h"))}</h3><p class="vp-mat">${esc(ui("fr_lead"))}</p>`;
    ["trauma","resp","infant","clin","water"].forEach(ct=>{ const its=fr.items.filter(x=>x.cat===ct); if(!its.length) return;
      h+=`<h4 class="vp-cat">${esc(ui("fr_cat_"+ct))}</h4><div class="vp-fr">`+its.map(x=>`<a class="vp-fritem" href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.what)}</b><span>${esc(x.name)} &middot; ${esc(x.mat)}${x.time?(" &middot; "+esc(x.time)):""}</span><em>${esc(ui("print_download"))} &#8599;${x.oshwa?(" &middot; "+esc(x.oshwa)):""}</em></a>`).join("")+`</div>`;
    });
    h+=`<p class="vp-caveat">${esc(ui("fr_note"))}</p></div>`;
  }
  var _murl=(p.map&&p.map.url)||"https://vzla.ushahidi.io/map";
  var _madd=(p.map&&p.map.add)||"https://vzla.ushahidi.io/post/create";
  h+=`<div class="vp-block"><h3>${esc(ui("print_centers_h"))}</h3>`
    +`<a class="vp-mapcard" href="${esc(_murl)}" target="_blank" rel="noopener" data-ev="ushahidi-map"><span class="vp-mapcard-ic"></span><span class="vp-mapcard-tx"><b>${esc(ui("print_map"))}</b><small>${esc(ui("map_open_hint"))}</small></span><span class="vp-mapcard-arr">&#8599;</span></a>`
    +`<div class="vp-maprow"><a class="vp-mapbtn alt" href="${esc(_madd)}" target="_blank" rel="noopener" data-ev="map/add">${esc(ui("map_add"))}</a>${p.centers_doc?` &middot; <a class="vp-doc" href="${esc(p.centers_doc)}" download>${esc(ui("print_centers_all"))} &#8595;</a>`:""}</div></div>`;
  return h+`</section>`;
}
function rArchive(){

  let h=`<section class="ve-arch"><h2><i class="sn">03</i>${esc(ui("from_archive_h"))}</h2><p class="vp-lead">${esc(ui("from_archive_lead"))}</p>`;
  fa.needs.forEach(n=>{ if(!n.items||!n.items.length) return;
    h+=`<details class="va-need" data-need="${esc(n.key)}"><summary data-ev="ve-need/${n.key}">${esc(pick(n,"label"))} <i>${n.count} ${esc(ui("from_archive_more"))}</i></summary><div class="va-items">`
     +n.items.map(it=>`<a class="va-item" href="${esc(it.url||'#')}"${it.url?' target="_blank" rel="noopener"':''}><b>${esc(pick(it,"title"))}</b><span>${esc(it.source)}${it.oh?' &middot; OH':''}</span></a>`).join("")
     +`</div></details>`;

function buildVE(){
  const ve=DATA.venezuela, byId={}; (DATA.crisis||[]).forEach(c=>byId[c.id]=c);
  let html=`<section class="ve-hero"><div class="ve-kicker">Venezuela</div><p class="ve-lead">${ui("ve_help_lead")}</p></section>`;
  html+=veActionBar();
  html+=veOffline();
  html+=rPrint();
  html+=`<div class="safety">${ui("ve_live")}</div>`;
  html+=`<h2 class="ve-playbook-h"><i class="sn">02</i>${esc(ui("ve_h_playbook"))}</h2>`;
  ve.scenarios.forEach(s=>{
    html+=`<section class="needgroup" data-need="${esc(s.key)}"><h2>${esc(pick(s,"title"))} <span>${s.items.length}</span></h2><p class="ve-note">${esc(pick(s,"note"))}</p>`;
    s.items.forEach(id=>{ const c=byId[id]; if(!c) return;
      const oh=c.open_hardware?`<span class="ohbadge">${esc(ui("crisis_oh"))}${c.oshwa_uid?(" · "+esc(c.oshwa_uid)):""}</span>`:"";
      const src=c.source_url?`<a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.source)} ↗</a>`:esc(c.source);
      html+=`<article class="citem"><div class="cviz">${crisisViz(c)}</div><div>`
        +`<div class="citem-head"><h3>${esc(lcf(c,"title"))}</h3><div class="chips">${oh}</div></div>`
        +`<p class="csum">${esc(lcf(c,"summary"))}</p><div class="csrc">${esc(ui("crisis_src"))}: ${src}</div></div></article>`;
    });
    html+=`</section>`;
  });
  html+=rArchive();
  html+=veContributeBand();
  // context moved to the foot — the standalone page leads with action for people living the crisis
  html+=`<section class="ve-reality qp"><h2><i class="sn">05</i>${esc(ui("ve_what_h"))}</h2><p>${ui("ve_lead")}</p></section>`;
  if(ve.context) html+=`<div class="ve-context">`+ve.context.map(c=>`<a class="ve-stat" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="ve-stat-v">${esc(pick(c,"value"))}</span><span class="ve-stat-n">${esc(pick(c,"note"))}</span></a>`).join("")+`</div>`;
  html+=`<section class="ve-reality"><h2>${esc(ui("ve_h_reality"))}</h2><p>${ui("ve_reality")}</p><p class="ve-principle">${ui("ve_principle")}</p></section>`;
  html+=`<div class="ve-resources"><b>${esc(ui("ve_resources"))}:</b> `+ve.resources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`).join(" &nbsp;·&nbsp; ")+`</div>`;
  document.getElementById("ve-body").innerHTML=html;
}
