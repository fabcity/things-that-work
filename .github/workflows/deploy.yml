name: Deploy to Cloudflare Pages

# Deploys the committed deploy/ folder to Cloudflare Pages on every push to main.
# Set repo secrets first: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# (When you change data/ or a template, rebuild with `python3 build_dataset.py`,
#  refresh deploy/, and commit it — this workflow does not build, it publishes.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=things-that-work --branch=main
